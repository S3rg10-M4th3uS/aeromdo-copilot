[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aeromdo-copilot"
version = "0.1.0"
description = "Physics-Informed Surrogate Modeling, Multi-Fidelity PSO, and Agentic RAG Copilot for Aircraft Multidisciplinary Design Optimization (SAE AeroDesign)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sérgio Matheus Araujo Silva", email = "sergiomatheuss09@gmail.com" }
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
